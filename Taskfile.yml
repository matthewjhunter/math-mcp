version: "3"

tasks:
  default:
    deps: [test, lint]

  build:
    desc: Build the math-mcp binary
    cmds:
      - go build -o math-mcp ./cmd/math-mcp

  test:
    desc: Run all tests with race detector
    cmds:
      - go test -race -count=1 ./...

  cover:
    desc: Generate coverage report
    cmds:
      - go test -race -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  vuln:
    desc: Run govulncheck
    cmds:
      - govulncheck ./...

  tidy:
    desc: Tidy go.mod
    cmds:
      - go mod tidy

  install:
    desc: Install math-mcp into $GOBIN/$GOPATH/bin
    cmds:
      - go install ./cmd/math-mcp
